<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ear Trainer</title>
  <script>
    // daisyUI's plain CSS doesn't follow the system theme by itself
    const dark = matchMedia("(prefers-color-scheme: dark)");
    const setTheme = () => (document.documentElement.dataset.theme = dark.matches ? "dark" : "light");
    setTheme();
    dark.addEventListener("change", setTheme);
  </script>
  <link rel="stylesheet" href="vendor/daisyui.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/tailwindcss-browser.js"></script>
  <script src="vendor/abcjs-basic-min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="min-h-screen bg-base-200">
  <div class="drawer drawer-end">
  <input id="settings-drawer" type="checkbox" class="drawer-toggle" aria-label="Show settings">
  <main class="drawer-content mx-auto flex w-full max-w-xl flex-col gap-3 p-4">
    <header class="flex items-center justify-between gap-3">
      <h1 class="text-lg font-semibold">Ear Trainer</h1>
      <label for="settings-drawer" class="btn btn-ghost btn-sm gap-2" title="Settings">
        <span id="summary" class="font-normal text-base-content/70"></span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span class="sr-only">Settings</span>
      </label>
    </header>
    <section class="card bg-base-100 shadow-sm" aria-live="polite">
      <div class="card-body min-h-80 justify-between gap-6 text-center">
        <p id="status" class="min-h-6 text-base-content/60">Loading samples…</p>
        <div id="answer" hidden>
          <h2 id="answer-title" class="text-4xl font-bold"></h2>
          <p id="answer-subtitle" class="mt-1 text-xl text-base-content/70"></p>
          <div class="tabs tabs-box tabs-sm mx-auto mt-5 w-fit" role="tablist" aria-label="Show the answer as">
            <label class="tab"><input type="radio" name="answerView" value="staff" class="sr-only">Staff</label>
            <label class="tab"><input type="radio" name="answerView" value="keyboard" class="sr-only">Keyboard</label>
            <label class="tab"><input type="radio" name="answerView" value="notes" class="sr-only">Notes</label>
          </div>
          <div id="answer-view" class="mt-4 min-h-28"></div>
        </div>
        <div class="flex gap-3">
          <button id="replay" type="button" class="btn btn-lg flex-1" disabled>Replay <kbd class="kbd kbd-sm">R</kbd></button>
          <button id="primary" type="button" class="btn btn-lg btn-primary flex-1" disabled>Start <kbd class="kbd kbd-sm">Space</kbd></button>
        </div>
      </div>
    </section>

  </main>

  <div class="drawer-side z-20">
    <label for="settings-drawer" class="drawer-overlay" aria-label="Close settings"></label>
    <form id="settings" class="min-h-full w-80 bg-base-100 p-5 sm:w-96">
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold">Settings</h2>
          <label for="settings-drawer" class="btn btn-ghost btn-sm btn-square" aria-label="Close settings">✕</label>
        </div>
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Mode</legend>
          <div class="join w-full">
            <input class="join-item btn flex-1" type="radio" name="mode" value="intervals" aria-label="Intervals">
            <input class="join-item btn flex-1" type="radio" name="mode" value="chord" aria-label="Over a chord">
          </div>
        </fieldset>

        <fieldset id="chord-settings" class="fieldset">
          <legend class="fieldset-legend">Chords</legend>
          <div class="join w-full">
            <input class="join-item btn btn-sm flex-1" type="radio" name="chordSource" value="key" aria-label="In a key">
            <input class="join-item btn btn-sm flex-1" type="radio" name="chordSource" value="fixed" aria-label="Fixed chord">
          </div>
          <div class="mt-2 flex flex-wrap gap-4">
            <label class="flex flex-col gap-1" data-source="key"><span class="label">Key</span><select id="key" class="select select-sm"></select></label>
            <label class="flex flex-col gap-1" data-source="fixed"><span class="label">Root</span><select id="chord-root" class="select select-sm w-28"></select></label>
            <label class="flex flex-col gap-1" data-source="fixed"><span class="label">Chord</span><select id="chord-type" class="select select-sm"></select></label>
          </div>
        </fieldset>

        <fieldset class="fieldset">
          <legend id="instrument-legend" class="fieldset-legend">Instrument</legend>
          <select id="instrument" class="select select-sm" aria-label="Instrument"></select>
        </fieldset>

        <fieldset class="fieldset">
          <legend id="range-legend" class="fieldset-legend">Note range</legend>
          <div class="flex flex-wrap gap-4">
            <label class="flex flex-col gap-1"><span class="label">Lowest</span><select id="range-low" class="select select-sm w-32"></select></label>
            <label class="flex flex-col gap-1"><span class="label">Highest</span><select id="range-high" class="select select-sm w-32"></select></label>
          </div>
        </fieldset>

        <fieldset class="fieldset">
          <legend class="fieldset-legend">Intervals</legend>
          <div class="mb-2 flex flex-wrap gap-2">
            <button type="button" class="btn btn-xs btn-ghost border-base-300" data-preset="octave">All ≤ 8ve</button>
            <button type="button" class="btn btn-xs btn-ghost border-base-300" data-preset="thirds">3rds</button>
            <button type="button" class="btn btn-xs btn-ghost border-base-300" data-preset="perfect">Perfect</button>
            <button type="button" class="btn btn-xs btn-ghost border-base-300" data-preset="clear">Clear</button>
          </div>
          <div id="intervals" class="grid grid-cols-[repeat(auto-fill,minmax(4.5rem,1fr))] gap-1.5"></div>
        </fieldset>

        <fieldset id="direction-settings" class="fieldset">
          <legend class="fieldset-legend">Direction</legend>
          <div class="join w-full">
            <input class="join-item btn btn-sm flex-1" type="radio" name="direction" value="up" aria-label="Up">
            <input class="join-item btn btn-sm flex-1" type="radio" name="direction" value="mixed" aria-label="Up &amp; down">
          </div>
        </fieldset>

        <fieldset class="fieldset">
          <legend class="fieldset-legend">Next question</legend>
          <div class="join w-full">
            <input class="join-item btn btn-sm flex-1" type="radio" name="advance" value="manual" aria-label="When I press Next">
            <input class="join-item btn btn-sm flex-1" type="radio" name="advance" value="auto" aria-label="Automatically">
          </div>
        </fieldset>

        <fieldset class="fieldset">
          <legend class="fieldset-legend">Timing</legend>
          <label class="slider">Note length <output id="noteLength-out"></output>
            <input id="noteLength" type="range" class="range range-sm range-primary" min="0.4" max="2" step="0.1"></label>
          <label class="slider">Delay before answer <output id="revealDelay-out"></output>
            <input id="revealDelay" type="range" class="range range-sm range-primary" min="0" max="5" step="0.5"></label>
          <label class="slider">Answer shown for (auto) <output id="advanceDelay-out"></output>
            <input id="advanceDelay" type="range" class="range range-sm range-primary" min="1" max="10" step="0.5"></label>
        </fieldset>
      </div>
    </form>
  </div>
  </div>
</body>
</html>
